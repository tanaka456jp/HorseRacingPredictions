name: JRA-VAN Free Trial RACE Auth Probe

on:
  push:
    branches:
      - research/exotic-longshot-race-centered-phase11
    paths:
      - "research/jravan_race_auth_probe_request.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jravan-free-trial-race-auth-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Probe RACE auth without reading raw records
    runs-on: [self-hosted, Windows]
    timeout-minutes: 10

    steps:
      - name: Checkout without deleting local archives
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      - name: Run bounded sanitized RACE auth probe
        id: probe
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $python = Join-Path $PWD ".venv-jravan\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw ".venv-jravan is missing."
          }
          & ".\scripts\run_jravan_race_auth_probe_bounded.ps1" `
            -PythonPath $python `
            -Output "artifacts\jravan_race_auth_probe.json" `
            -TimeoutSeconds 90
          "exit_code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT

      - name: Publish sanitized probe only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jravan-race-auth-probe
          path: artifacts/jravan_race_auth_probe.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail only after sanitized report is published
        if: always()
        shell: powershell
        run: |
          $code = "${{ steps.probe.outputs.exit_code }}"
          if ([string]::IsNullOrWhiteSpace($code)) {
            throw "Probe did not produce an exit code."
          }
          if ([int]$code -ne 0) {
            throw "Bounded JRA-VAN auth probe did not complete normally; inspect the sanitized report."
          }
