name: JRA-VAN Free Trial RACE Auth Probe\n\non:\n  push:\n    branches:\n      - research/exotic-longshot-race-centered-phase11\n    paths:\n      - "research/jravan_race_auth_probe_request.txt"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: jravan-free-trial-race-auth-probe\n  cancel-in-progress: true\n\njobs:\n  probe:\n    name: Probe RACE auth without reading raw records\n    runs-on: [self-hosted, Windows]\n    timeout-minutes: 10\n\n    steps:\n      - name: Checkout without deleting local archives\n        uses: actions/checkout@v4\n        with:\n          clean: false\n          persist-credentials: false\n\n      - name: Run sanitized RACE auth probe\n        shell: powershell\n        run: |\n          $ErrorActionPreference = "Stop"\n          $python = Join-Path $PWD ".venv-jravan\Scripts\python.exe"\n          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {\n            throw ".venv-jravan is missing."\n          }\n          & $python "scripts\probe_jravan_free_trial_race_auth.py" `\n            --output "artifacts\jravan_race_auth_probe.json"\n          if ($LASTEXITCODE -ne 0) {\n            throw "JRA-VAN RACE auth probe failed unexpectedly."\n          }\n\n      - name: Publish sanitized probe only\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: jravan-race-auth-probe\n          path: artifacts/jravan_race_auth_probe.json\n          if-no-files-found: error\n          retention-days: 14