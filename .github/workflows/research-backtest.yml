name: Historical Research Backtest

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/**"
    paths:
      - "research/full_run_request.txt"

concurrency:
  group: historical-research-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,research]"
          pip install kagglehub

      - name: Run full historical research
        run: |
          python scripts/run_kaggle_baseline.py

      - name: Publish full research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-full-research-artifacts
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 14
