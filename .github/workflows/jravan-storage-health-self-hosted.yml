name: JRA-VAN Storage Health

on:
  push:
    branches:
      - research/exotic-longshot-race-centered-phase11
    paths:
      - "research/jravan_storage_health_request.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jravan-storage-health
  cancel-in-progress: true

jobs:
  health:
    name: Check private JRA-VAN C/D storage health
    runs-on: [self-hosted, Windows]
    timeout-minutes: 10

    steps:
      - name: Checkout without deleting local archive
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      - name: Report sanitized storage health
        shell: powershell
        continue-on-error: true
        id: health
        run: |
          $ErrorActionPreference = "Stop"
          $python = Join-Path $PWD ".venv-jravan\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw ".venv-jravan is missing."
          }
          & $python "scripts\report_jravan_storage_health.py" `
            --output "artifacts\jravan_storage_health.json"
          "exit_code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT

      - name: Publish sanitized storage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jravan-storage-health
          path: artifacts/jravan_storage_health.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce D-drive archive health
        if: always()
        shell: powershell
        run: |
          $code = "${{ steps.health.outputs.exit_code }}"
          if ([string]::IsNullOrWhiteSpace($code)) {
            throw "Storage health check did not produce an exit code."
          }
          if ([int]$code -ne 0) {
            throw "JRA-VAN storage health is not ready; inspect the sanitized report."
          }