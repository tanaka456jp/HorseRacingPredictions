name: JRA-VAN Archive Migrate to D Drive

on:
  push:
    branches:
      - research/exotic-longshot-race-centered-phase11
    paths:
      - "research/jravan_archive_migration_request.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jravan-archive-migrate-to-d-drive
  cancel-in-progress: false

jobs:
  migrate:
    name: Verify and move private JRA-VAN archive to D drive
    runs-on: [self-hosted, Windows]
    timeout-minutes: 120

    steps:
      - name: Checkout without deleting local archives
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      - name: Migrate archive after SHA-256 verification
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $python = Join-Path $PWD ".venv-jravan\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw ".venv-jravan is missing."
          }
          if (-not (Test-Path -LiteralPath "D:\" -PathType Container)) {
            throw "D drive is unavailable; C-drive archive will remain untouched."
          }
          & $python "scripts\migrate_jravan_archive_to_d.py" `
            --delete-source-after-verify `
            --report-output "artifacts\jravan_archive_d_drive_migration_report.json"
          if ($LASTEXITCODE -ne 0) {
            throw "JRA-VAN D-drive migration failed; source archive remains on C drive."
          }

      - name: Publish sanitized migration report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jravan-archive-d-drive-migration-report
          path: artifacts/jravan_archive_d_drive_migration_report.json
          if-no-files-found: warn
          retention-days: 30