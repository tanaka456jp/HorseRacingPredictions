name: PC2 JV-Link Current-Week Auth Return Codes (No JVGets)

on:
  push:
    branches: ["feature/weekly-odds-free-note-20261021"]
    paths:
      - ".github/workflows/pc2-jvlink-currentweek-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc2-jvlink-currentweek-auth-once
  cancel-in-progress: false

jobs:
  validate-restricted-probe:
    name: Parse no-raw-data auth probe safely
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check no destructive/provider read operations
        shell: pwsh
        run: |
          foreach ($path in @(
            "scripts/probe_jvlink_bitness_child.ps1",
            "scripts/probe_jvlink_pc2_runner.ps1"
          )) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if (@($errors).Count -gt 0) { throw "JVLINK_AUTH_SYNTAX_ERROR" }
            $src = Get-Content -Raw -LiteralPath $path
            foreach ($pattern in @(
              '\.JVGets\s*\(', '\.JVRead\s*\(',
              '\.JVSetUIProperties\s*\(',
              '\bGet-ItemProperty\b', '\bSet-ItemProperty\b',
              '\bRemove-Item\b', '\bStart-Service\b',
              '\bInvoke-WebRequest\b', '\bInvoke-RestMethod\b'
            )) {
              if ($src -match $pattern) { throw "FORBIDDEN_JVLINK_AUTH_OPERATION" }
            }
          }
  pc2-current-week-auth:
    name: PC2 sequential x86 and x64 JVOpen current-week only
    needs: validate-restricted-probe
    runs-on: [self-hosted, Windows]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Existing registered COM plus bounded auth return codes
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\probe_jvlink_pc2_runner.ps1 `
            -AuthenticationProbe `
            -OutputPath "artifacts/jvlink_currentweek_auth.json"
          $report = Get-Content -LiteralPath "artifacts/jvlink_currentweek_auth.json" -Raw |
            ConvertFrom-Json
          if ($report.physicalPC2Verified -ne $true -or
              $report.authenticationProbeRequested -ne $true -or
              $report.usageKeyRead -ne $false -or
              $report.providerRawRecordsRead -ne $false -or
              $report.licenceSettingsModified -ne $false) {
            throw "PC2_JVLINK_AUTH_DIAG_SECURITY_PROOF_MISSING"
          }
          # JVOpen=-301 etc are diagnostic results, not a green auth claim.
      - name: Store sanitized return codes only, never provider records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc2-jvlink-currentweek-auth-return-codes
          path: artifacts/jvlink_currentweek_auth.json
          if-no-files-found: error
          retention-days: 7
