name: Bootstrap Free OpenCode CLI (Self-hosted)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "research/free_opencode_cli_bootstrap_request.txt"

permissions:
  contents: read

concurrency:
  group: horse-racing-free-opencode-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap isolated OpenCode CLI and smoke local Ollama
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      - name: Parse free OpenCode PowerShell scripts
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ".\scripts\smoke_free_opencode_ollama.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            Write-Error "smoke_free_opencode_ollama.ps1 has $($errors.Count) PowerShell parse error(s)."
            exit 1
          }

      - name: Bootstrap free OpenCode CLI
        shell: powershell
        run: |
          & .\scripts\install_free_opencode_cli.ps1 -ExpectedComputerName "DESKTOP-MVV1FD4" -Version "1.18.29"

      - name: Smoke OpenCode with local qwen3 8b only
        shell: powershell
        run: |
          & .\scripts\smoke_free_opencode_ollama.ps1 -ExpectedComputerName "DESKTOP-MVV1FD4" -Version "1.18.29" -Model "ollama/qwen3:8b" -TimeoutSeconds 240

      - name: Publish sanitized free-stack validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-opencode-cli-bootstrap-validation
          path: |
            artifacts/free_opencode_cli_install_validation.json
            artifacts/free_opencode_ollama_smoke_validation.json
          if-no-files-found: warn
          retention-days: 14
