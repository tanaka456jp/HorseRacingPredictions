name: Market Residual v12 Holdout Confirmation (Self-hosted)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "research/market_residual_v12_holdout_request.txt"

permissions:
  contents: read

concurrency:
  group: market-residual-v12-holdout-self-hosted
  cancel-in-progress: true

jobs:
  market-residual-v12-holdout:
    name: Confirm frozen residual v12 on 2025-2026 holdout
    runs-on: [self-hosted, Windows]
    timeout-minutes: 150

    steps:
      - name: Checkout without deleting local ignored data
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      - name: Run frozen v12 holdout confirmation
        shell: powershell
        run: |
          & .\scripts\run_market_residual_v12_holdout_runner.ps1

      - name: Publish sanitized validation only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-residual-v12-holdout-validation
          path: artifacts/market_residual_v12_holdout_runner_validation.json
          if-no-files-found: warn
          retention-days: 14
