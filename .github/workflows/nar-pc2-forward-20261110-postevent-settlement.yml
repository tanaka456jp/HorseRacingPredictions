name: NAR PC2 Real 2026-11-10 Forward Paper Settlement (POST-EVENT / NO EV)

on:
  push:
    branches: ["feature/weekly-odds-free-note-20261021"]
    paths:
      - ".github/workflows/nar-pc2-forward-20261110-postevent-settlement.yml"
      - "scripts/reconcile_nar_20261110_forward_official_results.py"
      - "tests/test_nar_20261110_real_forward_settlement.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nar-pc2-20261110-forward-postevent-one-shot
  cancel-in-progress: false

jobs:
  pc2-real-day-official-settlement:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 9
    steps:
      - name: Checkout reviewed only; no deletion of original private files
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Machine, branch and time-scoped official source guards
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -cne 'DESKTOP-MVV1FD4' -or
              $env:GITHUB_REPOSITORY -cne 'tanaka456jp/HorseRacingPredictions' -or
              $env:GITHUB_REF_NAME -cne 'feature/weekly-odds-free-note-20261021' -or
              [datetime]::UtcNow.ToString('yyyy-MM-dd') -cne '2026-11-10') {
            Write-Host 'NAR_FORWARD_SETTLEMENT_WRONG_PC_BRANCH_OR_DAY'
            exit 2
          }
          $review = 'D:\Development\HorseRacingPredictions-PrivateReview'
          $folder = Join-Path $review 'nar-prospective-captures'
          foreach ($p in @('D:\Development', $review, $folder)) {
            if (-not (Test-Path -LiteralPath $p -PathType Container) -or
                ((Get-Item -LiteralPath $p -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              Write-Host 'NAR_FORWARD_SETTLEMENT_PRIVATE_D_ONLY'
              exit 2
            }
          }
          if (-not (Test-Path -LiteralPath '.\scripts\reconcile_nar_20261110_forward_official_results.py' -PathType Leaf)) {
            Write-Host 'NAR_FORWARD_SETTLEMENT_SCRIPT_MISSING'
            exit 2
          }
          Write-Host 'NAR_FORWARD_SETTLEMENT_PRIVATE_PC2_READY'
      - name: Read ONLY earlier full-roster frozen forecast and one final NAR ZIP; no real tickets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:PYTHONPATH = Join-Path (Get-Location).Path 'src'
          $folder = 'D:\Development\HorseRacingPredictions-PrivateReview\nar-prospective-captures'
          try {
            $rows = @(& python -B .\scripts\reconcile_nar_20261110_forward_official_results.py --private-output-dir $folder 2>&1)
            if ($LASTEXITCODE -ne 0 -or $rows.Count -ne 1) {
              if ($rows.Count -eq 1) {
                $held = [string]$rows[0] | ConvertFrom-Json
                if ($held.schema -ceq 'NAR.PC2.RealProspectiveDaySettlement.v1' -and
                    [string]$held.staticReason -cmatch '^NAR_FORWARD_SETTLEMENT_[A-Z0-9_]{1,100}$') {
                  Write-Host ('NAR_FORWARD_SETTLEMENT_STATIC_HOLD_REASON=' + [string]$held.staticReason)
                  if ([string]$held.safeExceptionClass -cmatch '^(KeyError|TypeError|ValueError|NameError|IndexError|AttributeError|NarPreoffDailyHold|UNCLASSIFIED_ERROR)$' -and
                      [int]$held.safeOwnSourceLine -ge 0 -and [int]$held.safeOwnSourceLine -le 700) {
                    Write-Host ('NAR_FORWARD_SETTLEMENT_SAFE_CLASS=' + [string]$held.safeExceptionClass)
                    Write-Host ('NAR_FORWARD_SETTLEMENT_OWN_LINE=' + [int]$held.safeOwnSourceLine)
                  }
                }
              }
              throw 'NAR_FORWARD_SETTLEMENT_UNRESOLVED_OR_UNREADY'
            }
            $d = [string]$rows[0] | ConvertFrom-Json
            if ($d.schema -cne 'NAR.PC2.RealProspectiveDaySettlement.v1' -or
                $d.frozen_races -ne 59 -or
                $d.frozen_horses -ne 641 -or
                $d.official_result_races -gt 59 -or
                $d.interpretable_races + $d.unresolved_races -ne 59 -or
                $d.preoff_market_prices_known -ne $false -or
                $d.actual_wager_count -ne 0 -or
                $d.positive_ev_proven -ne $false -or
                $d.private_source_uploaded -ne $false -or
                $d.protected_historical_oos_opened -ne $false) {
              throw 'NAR_FORWARD_SETTLEMENT_INVALID_FULL_DAY_AUDIT'
            }
            if ($d.status -ceq 'COMPLETE_FORWARD_PAPER_SETTLEMENT_ONLY_NOT_EV') {
              if ($d.unresolved_races -ne 0 -or
                  $d.hypothetical_full_day_stake_yen -ne 11800 -or
                  $null -eq $d.hypothetical_full_day_paid_yen -or
                  $null -eq $d.hypothetical_full_day_net_yen -or
                  $null -eq $d.hypothetical_full_day_roi) {
                throw 'NAR_FORWARD_SETTLEMENT_COMPLETE_STATISTICS_CONFLICT'
              }
            } elseif ($d.status -ceq 'INCOMPLETE_FORWARD_SETTLEMENT_FULL_DAY_ROI_HELD') {
              if ($d.unresolved_races -lt 1 -or
                  $null -ne $d.hypothetical_full_day_paid_yen -or
                  $null -ne $d.hypothetical_full_day_net_yen -or
                  $null -ne $d.hypothetical_full_day_roi) {
                throw 'NAR_FORWARD_SETTLEMENT_INCOMPLETE_PROFIT_MUST_BE_HOLD'
              }
            } else {
              throw 'NAR_FORWARD_SETTLEMENT_UNKNOWN_GATE_STATUS'
            }
            # ALL real identities, private ZIP, scores, selected horse
            # numbers and actual payouts stay on PC2. Only aggregate data.
            [ordered]@{
              schema = 'NAR.PC2.RealProspectiveDaySettlement.v1'
              status = [string]$d.status
              frozenFlatRaceDenominator = [int]$d.frozen_races
              sourceReportedRaceCount = [int]$d.official_result_races
              sourceReportedPaybackRaceCount = [int]$d.official_payback_races
              cleanlyInterpretableWholeRaces = [int]$d.interpretable_races
              unresolvedWholeRaces = [int]$d.unresolved_races
              unresolvedStaticReasonCounts = $d.unresolved_reason_counts
              hypotheticalFullDayStakeYen = $d.hypothetical_full_day_stake_yen
              hypotheticalFullDayGrossYen = $d.hypothetical_full_day_paid_yen
              hypotheticalFullDayNetYen = $d.hypothetical_full_day_net_yen
              hypotheticalFullDayPaperROI = $d.hypothetical_full_day_roi
              anyRealPurchase = $false
              actualPreoffQuotesObserved = $false
              afterCostPositiveExpectedValueProven = $false
              sealedHistoricalOOSOpened = $false
              originalForecastUnchanged = $true
              privateRawSourceUploaded = $false
            } | ConvertTo-Json -Compress
          } catch {
            Write-Host 'NAR_FORWARD_SETTLEMENT_RESEARCH_HOLD_NO_EV'
            exit 2
          }
