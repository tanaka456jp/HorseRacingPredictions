name: NAR PC2 Save Already-Validated Dual CatBoost for Forward Research (PRIVATE / MANUAL)

# Manual-only private model persistence; never scrape, poll, bet or publish.
on:
  workflow_dispatch:
    inputs:
      explicit_personal_nar_research_permission:
        description: "I reviewed NAR source use and approve PRIVATE 2017-2021 CatBoost artifact persistence on PC2"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: nar-pc2-private-exploratory-model-freeze
  cancel-in-progress: false

jobs:
  freeze-dual-model-pc2:
    if: ${{ inputs.explicit_personal_nar_research_permission }}
    runs-on: [self-hosted, Windows]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Fit authorized old data only; save CBM to immutable PC2 private D directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -cne 'DESKTOP-MVV1FD4' -or
              $env:GITHUB_REPOSITORY -cne 'tanaka456jp/HorseRacingPredictions' -or
              $env:GITHUB_REF_NAME -cne 'feature/weekly-odds-free-note-20261021' -or
              $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch') {
            Write-Host 'NAR_DUAL_MODEL_WRONG_PC_OR_BRANCH'
            exit 2
          }
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:PYTHONPATH = Join-Path (Get-Location).Path 'src'
          $private = 'D:\Development\HorseRacingPredictions-PrivateReview'
          $source = 'D:\Development\HorseRacingPredictions\nar-personal'
          $vpy = Join-Path $private 'nar-exploratory-venv\Scripts\python.exe'
          $candidates = Join-Path $private 'nar-forward-models'
          $dest = Join-Path $candidates '2017-2021-fit-2022-tune-v1'
          foreach ($folder in @($private, $source)) {
            if (-not (Test-Path -LiteralPath $folder -PathType Container) -or
                ((Get-Item -LiteralPath $folder -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              Write-Host 'NAR_DUAL_MODEL_PRIVATE_SOURCE_HOLD'
              exit 2
            }
          }
          if (-not (Test-Path -LiteralPath $vpy -PathType Leaf) -or
              (Test-Path -LiteralPath $dest)) {
            Write-Host 'NAR_DUAL_MODEL_ENV_OR_DEST_ALREADY_EXISTS_HOLD'
            exit 2
          }
          if (-not (Test-Path -LiteralPath $candidates -PathType Container)) {
            New-Item -ItemType Directory -Path $candidates -ErrorAction Stop | Out-Null
          }
          if (((Get-Item -LiteralPath $candidates -Force).Attributes -band
                [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              (Get-PSDrive -Name D).Free -lt 1073741824) {
            Write-Host 'NAR_DUAL_MODEL_PRIVATE_STORAGE_HOLD'
            exit 2
          }
          try {
            $raw = @(& $vpy -B .\scripts\screen_nar_pc2_exploratory_status_aware.py --local-nar-training-zip-directory $source --confirm-personal-private-nar-permission --iterations 40 --candidate-output-dir $dest 2>&1)
            if ($LASTEXITCODE -ne 0 -or $raw.Count -ne 1) {
              throw 'NAR_DUAL_MODEL_TRAIN_OR_SAVE_HOLD'
            }
            $d = [string]$raw[0] | ConvertFrom-Json
            if ($d.schema -cne 'NAR.PC2.Exploratory2022RankingSignal.v1' -or
                $d.status -cne 'NAR_EXPLORATORY_2022_RANKING_ONLY_SELECTION_BIAS_HOLD' -or
                $d.trained_model_exported -ne $true -or
                $d.private_model_artifact_hashes_not_logged -ne $true -or
                $d.independently_fitted_models -ne $true -or
                $d.protected_final_holdout_opened -ne $false -or
                $d.source_data_sent_to_github -ne $false -or
                $d.positive_expected_value_demonstrated -ne $false) {
              throw 'NAR_DUAL_MODEL_UNTRUSTED_AUDIT'
            }
            [ordered]@{
              schema = 'NAR.PC2.PrivateDualCatBoostForwardResearch.v1'
              status = 'PRIVATE_FITTED_MODEL_SAVED_NOT_PROSPECTIVE_PROOF'
              fitRaces = [int]$d.fit_races_2017_2021
              selectionRaces2022 = [int]$d.tune_races_2022
              candidateModelSavedPrivately = $true
              rawModelOrRacingDataUploaded = $false
              futureHitRateMeasured = $false
              positiveExpectedValueProven = $false
              actualWagers = 0
            } | ConvertTo-Json -Compress
          } catch {
            Write-Host 'NAR_DUAL_MODEL_PRIVATE_RESEARCH_HOLD_NO_EV'
            exit 2
          }
