name: Ranker v10 Development Research (Self-hosted)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "research/ranker_v10_development_request.txt"

permissions:
  contents: read

concurrency:
  group: ranker-v10-development-research-self-hosted
  cancel-in-progress: true

jobs:
  ranker-v10-development:
    name: Compare Ranker v9 and v10 on development-only split
    runs-on: [self-hosted, Windows]
    timeout-minutes: 150

    steps:
      - name: Checkout without deleting local ignored data
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      - name: Run Ranker v10 development-only research
        shell: powershell
        run: |
          & .\scripts\run_ranker_v10_development_runner.ps1

      - name: Publish sanitized validation only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranker-v10-development-validation
          path: artifacts/ranker_v10_development_runner_validation.json
          if-no-files-found: warn
          retention-days: 14
