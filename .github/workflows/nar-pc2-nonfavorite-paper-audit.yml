name: NAR PC2 Preoff Nonfavorite WIN Paper Audit (PRIVATE / MANUAL ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nar-pc2-nonfavorite-paper-audit-manual
  cancel-in-progress: false

jobs:
  pc2-private-paired-evaluation:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: No-provider-request, private PC2 only, aggregate metrics only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -cne 'DESKTOP-MVV1FD4' -or
              $env:GITHUB_REPOSITORY -cne 'tanaka456jp/HorseRacingPredictions' -or
              $env:GITHUB_REF_NAME -cne 'feature/weekly-odds-free-note-20261021' -or
              $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch') {
            Write-Host 'NAR_NONFAVORITE_WRONG_PC_OR_BRANCH'; exit 2
          }
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:PYTHONPATH = Join-Path (Get-Location).Path 'src'
          $base = 'D:\Development\HorseRacingPredictions-PrivateReview\nar-prospective-captures'
          $inputJson = Join-Path $base 'nonfavorite_forward_PRIVATE.json'
          try {
            if (-not (Test-Path -LiteralPath $inputJson -PathType Leaf) -or
                ((Get-Item -LiteralPath $inputJson -Force).Attributes -band
                [IO.FileAttributes]::ReparsePoint) -ne 0) {
              # Read-only source readiness, no filenames, dates, paths,
              # individual races, horses, prices or original content.
              $counts = [ordered]@{
                schema = 'NAR.PC2.NonfavoriteReadinessAggregate.v1'
                status = 'HOLD_PRIVATE_PAIRED_INPUT_NOT_AVAILABLE'
                baseline_files = 0
                preoff_capture_files = 0
                manually_downloaded_odds_files = 0
                source_records_exported = $false
                after_cost_positive_expected_value_proven = $false
                actual_tickets_purchased = $false
              }
              if (Test-Path -LiteralPath $base -PathType Container) {
                $patterns = @{
                  baseline_files = '*_baseline_forecast_PRIVATE.json'
                  preoff_capture_files = '*_odds_private_provenance.json'
                  manually_downloaded_odds_files = '*_manually_downloaded_odds_PRIVATE.json'
                }
                foreach ($key in $patterns.Keys) {
                  $counts[$key] = @(
                    Get-ChildItem -LiteralPath $base -File -Filter $patterns[$key] -ErrorAction Stop |
                    Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0 }
                  ).Count
                }
              }
              # Offline evidence readiness: report aggregate counts only.
              $readiness = @(& python -B .\\scripts\\audit_nar_nonfavorite_private_pair_readiness.py --private-capture-dir $base 2>&1)
              if ($LASTEXITCODE -ne 0 -or $readiness.Count -ne 1) {
                throw 'PRIVATE_READINESS_HOLD'
              }
              $d = [string]$readiness[0] | ConvertFrom-Json
              if ($d.schema -cne 'NAR.PC2.NonfavoritePairReadiness.v1' -or
                  $d.source_records_exported -ne $false) {
                throw 'PRIVATE_READINESS_UNTRUSTED'
              }
              $d | ConvertTo-Json -Compress
              # Missing real paired evidence is an explicit failed audit,
              # not a green PC2 research validation.
              exit 2
            }
            $raw = @(& python -B .\scripts\evaluate_nar_nonfavorite_preoff_local.py --reviewed-local-json $inputJson 2>&1)
            if ($LASTEXITCODE -ne 0 -or $raw.Count -ne 1) {
              throw 'PRIVATE_AUDIT_HOLD'
            }
            $d = [string]$raw[0] | ConvertFrom-Json
            if ($d.schema -cne 'NAR.PC2.NonfavoriteAggregateOnly.v1' -or
                $d.source_records_exported -ne $false -or
                $d.after_cost_positive_expected_value_proven -ne $false -or
                $d.actual_tickets_purchased -ne $false) {
              throw 'NAR_NONFAVORITE_UNTRUSTED_AUDIT'
            }
            # No paths, original race keys, horses, odds or private ZIP in logs.
            $d | ConvertTo-Json -Compress
          } catch {
            Write-Host 'NAR_NONFAVORITE_PRIVATE_FORWARD_EVIDENCE_HOLD_NO_EV'
            exit 2
          }
