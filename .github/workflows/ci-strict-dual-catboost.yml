name: Real CatBoost Dual-Model Research Smoke (Fictional Only)

on:
  push:
    branches: ["feature/weekly-odds-free-note-20261021"]
    paths:
      - "src/horse_racing_predictions/strict_dual_catboost_candidate.py"
      - "tests/test_strict_dual_catboost_candidate.py"
      - "src/horse_racing_predictions/dual_candidate_private_preview.py"
      - "tests/test_dual_candidate_private_preview.py"
      - ".github/workflows/ci-strict-dual-catboost.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/horse_racing_predictions/strict_dual_catboost_candidate.py"
      - "tests/test_strict_dual_catboost_candidate.py"
      - "src/horse_racing_predictions/dual_candidate_private_preview.py"
      - "tests/test_dual_candidate_private_preview.py"
      - ".github/workflows/ci-strict-dual-catboost.yml"

permissions:
  contents: read

concurrency:
  group: strict-dual-catboost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-catboost-only-synthetic-races:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install only open-source research dependency
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev,research]"
      - name: Actually train and freeze independent CatBoost models on fictional pre-2025 races
        run: |
          pytest -q tests/test_strict_dual_catboost_candidate.py tests/test_dual_candidate_private_preview.py -rs
