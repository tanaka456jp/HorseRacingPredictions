name: Exotic Direct Trio Phase 6 (Self-hosted)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "research/exotic_direct_trio_phase6_request.txt"

permissions:
  contents: read

concurrency:
  group: exotic-direct-trio-phase6-self-hosted
  cancel-in-progress: true

jobs:
  direct-trio:
    name: Direct trio Phase 6 development gate
    runs-on: [self-hosted, Windows]
    timeout-minutes: 180

    steps:
      - name: Checkout without deleting local ignored data
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      - name: Run direct trio Phase 6 research
        shell: powershell
        run: |
          & .\scripts\run_exotic_trio_phase6_runner.ps1

      - name: Publish sanitized validation only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exotic-direct-trio-phase6-development-validation
          path: artifacts/exotic_trio_phase6_runner_validation.json
          if-no-files-found: warn
          retention-days: 14
