name: Autonomous Development 12h (PC2 Free OpenCode)

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Number of hourly development cycles"
        required: false
        default: "12"
      cycle_minutes:
        description: "Target minutes per cycle"
        required: false
        default: "60"
  push:
    branches:
      - main
    paths:
      - "research/free_opencode_autonomous_dev_12h_request.txt"

permissions:
  contents: read

concurrency:
  group: horse-racing-autonomous-development-pc2
  cancel-in-progress: true

jobs:
  develop:
    name: Run guarded free autonomous development on PC2
    # DESKTOP-MVV1FD4 is PC2. PC1 identity/failover will be wired separately.
    runs-on: [self-hosted, Windows]
    timeout-minutes: 780

    steps:
      - name: Checkout orchestrator source
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      - name: Check R&D priority mode
        id: rnd_priority
        shell: powershell
        run: |
          $skip = (
            "${{ github.event_name }}" -eq "push" -and
            (Test-Path -LiteralPath ".\research\ev_rnd_primary.txt" -PathType Leaf)
          )
          $value = $skip.ToString().ToLowerInvariant()
          "skip=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "rnd_primary_skip_autonomous=$value"

      - name: Install Python test dependencies
        if: steps.rnd_priority.outputs.skip != 'true'
        shell: powershell
        run: |
          python -m pip install -e ".[dev]"

      - name: Parse free OpenCode PowerShell scripts
        if: steps.rnd_priority.outputs.skip != 'true'
        shell: powershell
        run: |
          $failed = $false
          foreach ($path in @(
            ".\scripts\audit_free_nemotron_opencode.ps1",
            ".\scripts\run_free_opencode_dev_cycle.ps1",
            ".\scripts\run_free_opencode_dev_12h.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$path has $($errors.Count) PowerShell parse error(s)."
            }
          }
          if ($failed) { exit 1 }

      - name: Bootstrap pinned free OpenCode CLI
        if: steps.rnd_priority.outputs.skip != 'true'
        shell: powershell
        run: |
          & .\scripts\install_free_opencode_cli.ps1 -ExpectedComputerName "DESKTOP-MVV1FD4" -Version "1.18.29"

      - name: Verify exact free Nemotron endpoint
        if: steps.rnd_priority.outputs.skip != 'true'
        id: nemotron_smoke
        continue-on-error: true
        shell: powershell
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          & .\scripts\audit_free_nemotron_opencode.ps1 -ExpectedComputerName "DESKTOP-MVV1FD4" -Version "1.18.29" -Model "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free" -TimeoutSeconds 240

      - name: Select free autonomous model
        if: steps.rnd_priority.outputs.skip != 'true'
        shell: powershell
        run: |
          $smokeOutcome = "${{ steps.nemotron_smoke.outcome }}"
          if ($smokeOutcome -eq "success") {
              $selected = "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
              $reason = "nemotron_smoke_passed"
          } else {
              $selected = "ollama/qwen3:8b"
              $reason = "nemotron_smoke_failed_local_fallback"
          }
          "SELECTED_FREE_MODEL=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SELECTED_FREE_MODEL_REASON=$reason" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "selected_free_model=$selected"
          Write-Host "selected_free_model_reason=$reason"
          Write-Host "paid_fallback_allowed=False"

      - name: Run free autonomous development cycles
        if: steps.rnd_priority.outputs.skip != 'true'
        shell: powershell
        env:
          REQUESTED_CYCLES: ${{ github.event.inputs.cycles || '12' }}
          REQUESTED_CYCLE_MINUTES: ${{ github.event.inputs.cycle_minutes || '60' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          & .\scripts\run_free_opencode_dev_12h.ps1 -Cycles ([int]$env:REQUESTED_CYCLES) -CycleMinutes ([int]$env:REQUESTED_CYCLE_MINUTES) -ExpectedComputerName "DESKTOP-MVV1FD4" -Version "1.18.29" -Model "$env:SELECTED_FREE_MODEL" -FallbackModel "ollama/qwen3:8b"

      - name: Publish sanitized autonomous-development summary
        if: always() && steps.rnd_priority.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: free-opencode-autonomous-dev-12h-summary
          path: artifacts/free_opencode_autonomous_dev_12h_summary.json
          if-no-files-found: warn
          retention-days: 14
