name: Historical Research Smoke

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "scripts/run_kaggle_baseline.py"
      - "src/horse_racing_predictions/backtest.py"
      - "src/horse_racing_predictions/calibration.py"
      - "src/horse_racing_predictions/config.py"
      - "src/horse_racing_predictions/data_sources.py"
      - "src/horse_racing_predictions/diagnostics.py"
      - "src/horse_racing_predictions/evaluation.py"
      - "src/horse_racing_predictions/features.py"
      - "src/horse_racing_predictions/leakage.py"
      - "src/horse_racing_predictions/modeling.py"
      - "src/horse_racing_predictions/oos.py"
      - "src/horse_racing_predictions/staking.py"
      - "src/horse_racing_predictions/strategy.py"
      - "src/horse_racing_predictions/strategy_selection.py"
      - "src/horse_racing_predictions/walkforward.py"
      - "pyproject.toml"

concurrency:
  group: historical-research-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,research]"
          pip install kagglehub

      - name: Run short walk-forward smoke
        run: |
          python scripts/run_kaggle_baseline.py --start 2020-07-01 --end 2021-07-31 --min-train-dates 40 --test-dates 10 --output artifacts/kaggle_smoke_summary.json --diagnostics-output artifacts/kaggle_smoke_diagnostics.json

      - name: Publish smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-smoke-artifacts
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 7
